<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <!-- CrazyGames SDK -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <!-- Yes2SDK CrazyGames Wrapper (inline - matches Core SDK API surface) -->
    <script>
        window.Yes2SDK = {
            _initialized: false,
            _platform: 'crazygames',
            _sdk: null,
            _loadingStarted: false,

            initializeAsync: function() {
                var self = this;
                if (typeof window.CrazyGames === 'undefined' || !window.CrazyGames.SDK) {
                    console.error('[Yes2SDK] CrazyGames SDK not found');
                    return Promise.reject({ code: 'NotInitialized', message: 'CrazyGames SDK not found' });
                }
                self._sdk = window.CrazyGames.SDK;
                return self._sdk.init().then(function() {
                    self._initialized = true;
                    console.log('[Yes2SDK] Initialized for CrazyGames');
                }).catch(function(error) {
                    console.error('[Yes2SDK] CrazyGames init failed:', error);
                    return Promise.reject(error);
                });
            },

            startGameAsync: function() {
                if (this._sdk) {
                    this._sdk.game.loadingStop();
                }
                console.log('[Yes2SDK] Game started');
                return Promise.resolve();
            },

            setLoadingProgress: function(progress) {
                if (this._sdk && !this._loadingStarted) {
                    this._sdk.game.loadingStart();
                    this._loadingStarted = true;
                }
            },

            performHapticFeedback: function() {
                // CrazyGames doesn't support haptic feedback
            },

            getPlatform: function() {
                return this._platform;
            },

            get isInitialized() {
                return this._initialized;
            },

            // Ads module - wraps CrazyGames SDK ad methods
            // API matches Core SDK: showInterstitial(placement, callbacks), showRewarded(placement, callbacks)
            ads: {
                showInterstitial: function(placement, callbacks) {
                    callbacks = callbacks || {};
                    var sdk = window.Yes2SDK._sdk;
                    if (!sdk) {
                        if (callbacks.noFill) callbacks.noFill();
                        if (callbacks.afterAd) callbacks.afterAd();
                        return Promise.resolve();
                    }

                    if (callbacks.beforeAd) callbacks.beforeAd();

                    return new Promise(function(resolve) {
                        sdk.ad.requestAd('midgame', {
                            adStarted: function() {
                                console.log('[Yes2SDK] Midgame ad started');
                            },
                            adFinished: function() {
                                console.log('[Yes2SDK] Midgame ad finished');
                                if (callbacks.afterAd) callbacks.afterAd();
                                resolve();
                            },
                            adError: function(error) {
                                console.warn('[Yes2SDK] Midgame ad error:', error);
                                if (callbacks.noFill) callbacks.noFill();
                                if (callbacks.afterAd) callbacks.afterAd();
                                resolve();
                            }
                        });
                    });
                },

                showRewarded: function(placement, callbacks) {
                    callbacks = callbacks || {};
                    var sdk = window.Yes2SDK._sdk;
                    if (!sdk) {
                        if (callbacks.noFill) callbacks.noFill();
                        if (callbacks.afterAd) callbacks.afterAd();
                        return Promise.resolve();
                    }

                    if (callbacks.beforeAd) callbacks.beforeAd();

                    return new Promise(function(resolve) {
                        sdk.ad.requestAd('rewarded', {
                            adStarted: function() {
                                console.log('[Yes2SDK] Rewarded ad started');
                            },
                            adFinished: function() {
                                console.log('[Yes2SDK] Rewarded ad finished');
                                if (callbacks.adViewed) callbacks.adViewed();
                                if (callbacks.afterAd) callbacks.afterAd();
                                resolve();
                            },
                            adError: function(error) {
                                console.warn('[Yes2SDK] Rewarded ad error:', error);
                                if (error && (error.code === 'unfilled' || error.code === 'adblock')) {
                                    if (callbacks.noFill) callbacks.noFill();
                                } else {
                                    if (callbacks.adDismissed) callbacks.adDismissed();
                                }
                                if (callbacks.afterAd) callbacks.afterAd();
                                resolve();
                            }
                        });
                    });
                },

                showBanner: function(position) {
                    var sdk = window.Yes2SDK._sdk;
                    if (!sdk || !sdk.banner) {
                        return Promise.reject({ code: 'NotInitialized', message: 'SDK not initialized' });
                    }
                    var containerId = 'yes2sdk-banner-' + position;
                    return sdk.banner.requestBanner({ id: containerId, width: 728, height: 90 });
                },

                hideBanner: function() {
                    var sdk = window.Yes2SDK._sdk;
                    if (sdk && sdk.banner) {
                        sdk.banner.clearAllBanners();
                    }
                },

                isAdBlocked: function() {
                    return false;
                }
            }
        };
    </script>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        canvas.style.width = "100%";
        canvas.style.height = "100%";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                progressBarFull.style.width = 100 * progress + "%";
            }).then(function(unityInstance) {
                loadingBar.style.display = "none";
                window.unityInstance = unityInstance;
            }).catch(function(message) {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
