<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}} - Poki</title>
    <!--
        NOTE: This HTML is for LOCAL TESTING ONLY.
        On Poki.com, the HTML is auto-generated from index.json.
        Yes2SDK wrapper is inlined (no external CDN) to comply with Poki's CSP.
    -->
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #unity-container { width: 100%; height: 100%; position: absolute; }
        #unity-canvas { width: 100%; height: 100%; background: #231F20; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <!-- Mock PokiSDK for local testing (on Poki.com this is injected automatically) -->
    <script>
        if (typeof PokiSDK === 'undefined') {
            console.log('[Yes2SDK] Local testing mode - using mock PokiSDK');
            window.PokiSDK = {
                init: function() {
                    console.log('[PokiSDK Mock] init');
                    return Promise.resolve();
                },
                gameLoadingStart: function() { console.log('[PokiSDK Mock] gameLoadingStart'); },
                gameLoadingFinished: function() { console.log('[PokiSDK Mock] gameLoadingFinished'); },
                gameplayStart: function() { console.log('[PokiSDK Mock] gameplayStart'); },
                gameplayStop: function() { console.log('[PokiSDK Mock] gameplayStop'); },
                commercialBreak: function() {
                    console.log('[PokiSDK Mock] commercialBreak');
                    return Promise.resolve();
                },
                rewardedBreak: function() {
                    console.log('[PokiSDK Mock] rewardedBreak');
                    return Promise.resolve(true);
                },
                isAdBlocked: function() { return false; },
                getLanguage: function() { return 'en'; }
            };
        }
    </script>

    <!-- Yes2SDK Poki Wrapper (same as inlined in index.json for production) -->
    <script>
        window.Yes2SDK = {
            _initialized: false,
            _platform: 'poki',

            initializeAsync: function() {
                var self = this;
                return PokiSDK.init().then(function() {
                    self._initialized = true;
                    PokiSDK.gameLoadingStart();
                    console.log('[Yes2SDK] Initialized for Poki');
                    return Promise.resolve();
                });
            },

            startGameAsync: function() {
                PokiSDK.gameLoadingFinished();
                console.log('[Yes2SDK] Game started');
                return Promise.resolve();
            },

            setLoadingProgress: function(progress) {
                // Poki doesn't have a loading progress API
            },

            performHapticFeedback: function() {
                // Poki doesn't support haptic feedback
            },

            getPlatform: function() {
                return this._platform;
            },

            get isInitialized() {
                return this._initialized;
            },

            // Ads module - wraps PokiSDK ad methods
            // API matches Core SDK: showInterstitial(placement, callbacks), showRewarded(placement, callbacks)
            ads: {
                showInterstitial: function(placement, callbacks) {
                    callbacks = callbacks || {};
                    if (callbacks.beforeAd) callbacks.beforeAd();
                    return PokiSDK.commercialBreak().then(function() {
                        if (callbacks.afterAd) callbacks.afterAd();
                    }).catch(function(error) {
                        console.warn('[Yes2SDK] commercialBreak failed:', error);
                        if (callbacks.noFill) callbacks.noFill();
                        if (callbacks.afterAd) callbacks.afterAd();
                    });
                },

                showRewarded: function(placement, callbacks) {
                    callbacks = callbacks || {};
                    if (callbacks.beforeAd) callbacks.beforeAd();
                    return PokiSDK.rewardedBreak().then(function(success) {
                        if (success) {
                            if (callbacks.adViewed) callbacks.adViewed();
                        } else {
                            if (callbacks.adDismissed) callbacks.adDismissed();
                        }
                        if (callbacks.afterAd) callbacks.afterAd();
                    }).catch(function(error) {
                        console.warn('[Yes2SDK] rewardedBreak failed:', error);
                        if (callbacks.noFill) callbacks.noFill();
                        if (callbacks.afterAd) callbacks.afterAd();
                    });
                },

                showBanner: function(position) {
                    // Poki doesn't support banners
                    return Promise.reject({
                        code: 'NotSupported',
                        message: 'Banners not supported on Poki',
                        context: 'ads.showBanner'
                    });
                },

                hideBanner: function() {
                    // Poki doesn't support banners - no-op
                },

                isAdBlocked: function() {
                    return PokiSDK.isAdBlocked ? PokiSDK.isAdBlocked() : false;
                }
            },

            // Analytics module - maps unified API to Poki SDK calls
            analytics: {
                logEvent: function(name, paramsJson) {
                    console.log('[Yes2SDK] Event:', name, paramsJson);
                },
                logLevelStart: function(level) {
                    console.log('[Yes2SDK] Level start:', level);
                    PokiSDK.gameplayStart();
                },
                logLevelEnd: function(level, score, success) {
                    console.log('[Yes2SDK] Level end:', level, score, success);
                    PokiSDK.gameplayStop();
                },
                logScore: function(score, level) {
                    console.log('[Yes2SDK] Score:', score, level);
                },
                logTutorialStart: function() {
                    console.log('[Yes2SDK] Tutorial start');
                },
                logTutorialEnd: function() {
                    console.log('[Yes2SDK] Tutorial end');
                },
                logPurchase: function(productId, price, currency) {
                    console.log('[Yes2SDK] Purchase:', productId, price, currency);
                }
            },

            // Session module - locale, device, orientation, traffic source, entry point
            session: {
                _data: {},

                getLocale: function() {
                    if (typeof PokiSDK !== 'undefined' && PokiSDK.getLanguage) {
                        return PokiSDK.getLanguage() || navigator.language || 'en';
                    }
                    return navigator.language || 'en';
                },

                getCountry: function() {
                    return ''; // Poki has no country API
                },

                getDevice: function() {
                    var ua = navigator.userAgent || '';
                    if (/tablet|ipad|playbook|silk/i.test(ua)) return 'tablet';
                    if (/mobile|iphone|ipod|android|blackberry|opera mini|iemobile/i.test(ua)) return 'mobile';
                    return 'desktop';
                },

                getOrientation: function() {
                    return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
                },

                getTrafficSource: function() {
                    var params = {};
                    try {
                        var search = window.location.search.substring(1);
                        if (search) {
                            search.split('&').forEach(function(pair) {
                                var kv = pair.split('=');
                                params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
                            });
                        }
                    } catch(e) {}
                    return JSON.stringify({ referrer: document.referrer || '', params: params });
                },

                getEntryPointData: function() {
                    var params = {};
                    try {
                        var search = window.location.search.substring(1);
                        if (search) {
                            search.split('&').forEach(function(pair) {
                                var kv = pair.split('=');
                                params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
                            });
                        }
                    } catch(e) {}
                    return JSON.stringify(params);
                },

                setSessionData: function(dataJson) {
                    try {
                        this._data = JSON.parse(dataJson);
                    } catch(e) {
                        console.warn('[Yes2SDK] Invalid session data JSON:', dataJson);
                    }
                },

                getEntryPointAsync: function() {
                    return Promise.resolve('direct');
                }
            },

            // Player module - anonymous on Poki, data operations not supported
            player: {
                getPlayerAsync: function() {
                    return Promise.resolve({ id: 'anonymous', name: null, photo: null });
                },

                getDataAsync: function(keysJson) {
                    return Promise.reject({
                        code: 'FeatureNotSupported',
                        message: 'Player data is not supported on Poki',
                        context: 'player.getDataAsync'
                    });
                },

                setDataAsync: function(dataJson) {
                    return Promise.reject({
                        code: 'FeatureNotSupported',
                        message: 'Player data is not supported on Poki',
                        context: 'player.setDataAsync'
                    });
                },

                flushDataAsync: function() {
                    return Promise.reject({
                        code: 'FeatureNotSupported',
                        message: 'Player data is not supported on Poki',
                        context: 'player.flushDataAsync'
                    });
                },

                getConnectedPlayersAsync: function() {
                    return Promise.reject({
                        code: 'FeatureNotSupported',
                        message: 'Connected players are not supported on Poki',
                        context: 'player.getConnectedPlayersAsync'
                    });
                },

                getSignedPlayerInfoAsync: function(payload) {
                    return Promise.reject({
                        code: 'FeatureNotSupported',
                        message: 'Signed player info is not supported on Poki',
                        context: 'player.getSignedPlayerInfoAsync'
                    });
                }
            },

            // Data module - localStorage fallback on Poki
            data: {
                getInt: function(key, defaultValue) {
                    try {
                        var val = localStorage.getItem('yes2sdk_' + key);
                        if (val === null) return defaultValue;
                        var parsed = parseInt(val, 10);
                        return isNaN(parsed) ? defaultValue : parsed;
                    } catch(e) { return defaultValue; }
                },
                setInt: function(key, value) {
                    try { localStorage.setItem('yes2sdk_' + key, value.toString()); } catch(e) {}
                },
                getFloat: function(key, defaultValue) {
                    try {
                        var val = localStorage.getItem('yes2sdk_' + key);
                        if (val === null) return defaultValue;
                        var parsed = parseFloat(val);
                        return isNaN(parsed) ? defaultValue : parsed;
                    } catch(e) { return defaultValue; }
                },
                setFloat: function(key, value) {
                    try { localStorage.setItem('yes2sdk_' + key, value.toString()); } catch(e) {}
                },
                getString: function(key, defaultValue) {
                    try {
                        var val = localStorage.getItem('yes2sdk_' + key);
                        return val === null ? defaultValue : val;
                    } catch(e) { return defaultValue; }
                },
                setString: function(key, value) {
                    try { localStorage.setItem('yes2sdk_' + key, value); } catch(e) {}
                },
                hasKey: function(key) {
                    try { return localStorage.getItem('yes2sdk_' + key) !== null; } catch(e) { return false; }
                },
                deleteKey: function(key) {
                    try { localStorage.removeItem('yes2sdk_' + key); } catch(e) {}
                },
                deleteAll: function() {
                    try {
                        var keysToRemove = [];
                        for (var i = 0; i < localStorage.length; i++) {
                            var k = localStorage.key(i);
                            if (k && k.indexOf('yes2sdk_') === 0) keysToRemove.push(k);
                        }
                        keysToRemove.forEach(function(k) { localStorage.removeItem(k); });
                    } catch(e) {}
                }
            },

            // Auth module - not supported on Poki
            auth: {
                isSupported: function() { return false; },
                getCurrentUserAsync: function() { return Promise.resolve(null); },
                signInAsync: function() {
                    return Promise.reject({ code: 'FeatureNotSupported', message: 'Auth is not supported on Poki', context: 'auth.signInAsync' });
                },
                getTokenAsync: function() {
                    return Promise.reject({ code: 'FeatureNotSupported', message: 'Auth is not supported on Poki', context: 'auth.getTokenAsync' });
                },
                showAccountLinkPromptAsync: function() {
                    return Promise.reject({ code: 'FeatureNotSupported', message: 'Auth is not supported on Poki', context: 'auth.showAccountLinkPromptAsync' });
                }
            },

            // Game module - gameplayStart/Stop maps to PokiSDK; rest are stubs
            game: {
                gameplayStart: function() { PokiSDK.gameplayStart(); },
                gameplayStop: function() { PokiSDK.gameplayStop(); },
                happyTime: function() { console.log('[Yes2SDK] happyTime not supported on Poki'); },
                inviteLink: function(paramsJson) {
                    return Promise.reject({ code: 'FeatureNotSupported', message: 'Invite links are not supported on Poki', context: 'game.inviteLink' });
                },
                getInviteParam: function(key) { return ''; },
                showInviteButton: function(paramsJson) { console.log('[Yes2SDK] showInviteButton not supported on Poki'); },
                hideInviteButton: function() {},
                getSettings: function() { return JSON.stringify({ disableChat: false, muteAudio: false }); },
                addSettingsChangeListener: function(callback) {},
                copyToClipboard: function(text) {
                    if (navigator.clipboard) { navigator.clipboard.writeText(text); }
                }
            },

            // Banners module - not supported on Poki
            banners: {
                showBanner: function(id, size, x, y) {
                    return Promise.reject({ code: 'FeatureNotSupported', message: 'Banners are not supported on Poki', context: 'banners.showBanner' });
                },
                hideBanner: function(id) {},
                hideAllBanners: function() {},
                refreshBanners: function() {}
            },

            // Friends module - not supported on Poki
            friends: {
                listFriendsAsync: function(page, size) {
                    return Promise.reject({ code: 'FeatureNotSupported', message: 'Friends are not supported on Poki', context: 'friends.listFriendsAsync' });
                }
            },

            // Score module - console.log on Poki (no leaderboard)
            score: {
                addScore: function(score) { console.log('[Yes2SDK] Score:', score); },
                submitScore: function(encrypted) { console.log('[Yes2SDK] SubmitScore:', encrypted); }
            }
        };
    </script>

    <script>
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        var canvas = document.querySelector("#unity-canvas");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                // Loading progress
            }).then(function(unityInstance) {
                window.unityInstance = unityInstance;
            }).catch(function(message) {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
