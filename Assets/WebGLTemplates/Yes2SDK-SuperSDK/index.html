<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #unity-container { width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; background: #0a0a0a; }

    /* ── Yes2Games Loading Screen ── */
    #y2g-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.6s ease-out;
    }
    #y2g-loader.y2g-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo wrapper — entrance animation */
    .y2g-logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.95);
      animation: y2gEntrance 0.8s ease-out 0.1s forwards;
    }

    /* Ambient glow behind logo */
    .y2g-glow {
      position: absolute;
      width: 500px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(168,85,247,0.18) 0%, transparent 70%);
      animation: y2gGlowPulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    /* Logo image */
    .y2g-logo {
      position: relative;
      width: min(55vw, 340px);
      height: auto;
      animation: y2gBreathe 2.5s ease-in-out 0.9s infinite;
      filter: drop-shadow(0 0 20px rgba(168,85,247,0.35));
    }

    /* Progress track */
    .y2g-progress-track {
      width: min(45vw, 220px);
      height: 3px;
      background: rgba(168,85,247,0.12);
      border-radius: 2px;
      margin-top: 44px;
      overflow: hidden;
      opacity: 0;
      animation: y2gFadeIn 0.4s ease-out 0.6s forwards;
    }

    /* Progress fill */
    .y2g-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #A855F7, #C084FC);
      border-radius: 2px;
      transition: width 0.3s ease-out;
      position: relative;
    }
    .y2g-progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: y2gShimmer 1.5s ease-in-out infinite;
    }

    /* Percentage text */
    .y2g-percent {
      color: rgba(168,85,247,0.55);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-top: 14px;
      opacity: 0;
      animation: y2gFadeIn 0.4s ease-out 0.9s forwards;
    }

    /* ── Keyframes ── */
    @keyframes y2gEntrance {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes y2gBreathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(168,85,247,0.35)); }
      50%      { transform: scale(1.03); filter: drop-shadow(0 0 32px rgba(168,85,247,0.55)); }
    }
    @keyframes y2gGlowPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }
    @keyframes y2gShimmer {
      0%   { left: -100%; }
      100% { left: 200%; }
    }
    @keyframes y2gFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes y2gComplete {
      0%   { transform: scale(1); filter: drop-shadow(0 0 20px rgba(168,85,247,0.35)); }
      50%  { transform: scale(1.06); filter: drop-shadow(0 0 44px rgba(168,85,247,0.7)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(168,85,247,0.35)); }
    }
  </style>
</head>

  <!--
    Yes2SDK is NOT defined here.
    The dashboard pipeline injects yes2sdk.umd.js + yes2sdk-{platform}.js
    which provides window.Yes2SDK with all module APIs.

    For local development without the dashboard, include:
    <script src="yes2sdk.umd.js"></script>
  -->

  <script>
    // ── Loading screen controller ──
    var Y2GLoader = (function() {
      var loader = document.getElementById('y2g-loader');
      var fill   = document.getElementById('y2g-progress-fill');
      var pct    = document.getElementById('y2g-percent');
      var logo   = loader ? loader.querySelector('.y2g-logo') : null;
      var done   = false;

      function setProgress(p) {
        var v = Math.max(0, Math.min(100, Math.round(p)));
        if (fill) fill.style.width = v + '%';
        if (pct)  pct.textContent  = v + '%';
      }

      function complete() {
        if (done) return;
        done = true;
        setProgress(100);
        // Final satisfying pulse
        if (logo) {
          logo.style.animation = 'y2gComplete 0.5s ease-in-out';
        }
        setTimeout(function() {
          if (loader) loader.classList.add('y2g-hidden');
          // Remove from DOM after fade
          setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 700);
        }, 500);
      }

      return { setProgress: setProgress, complete: complete };
    })();

    // ── Unity bootstrap ──
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
    };

    var canvas = document.querySelector("#unity-canvas");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        Y2GLoader.setProgress(progress * 100);
        // Report progress to Yes2SDK if available
        if (window.Yes2SDK && window.Yes2SDK.setLoadingProgress) {
          window.Yes2SDK.setLoadingProgress(Math.round(progress * 100));
        }
      }).then(function(unityInstance) {
        Y2GLoader.complete();
        // Store unity instance globally for SDK bridge access
        window.unityInstance = unityInstance;
      }).catch(function(message) {
        console.error('[Yes2SDK] Unity instance error:', message);
      });
    };
    document.body.appendChild(script);
  </script>
