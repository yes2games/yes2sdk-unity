<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <!-- Yes2SDK Debug Wrapper (mock - all operations succeed immediately) -->
    <script>
        window.Yes2SDK = {
            _initialized: false,
            _platform: 'debug',

            initializeAsync: function() {
                this._initialized = true;
                console.log('[Yes2SDK] Initialized (debug mode)');
                return Promise.resolve();
            },

            startGameAsync: function() {
                console.log('[Yes2SDK] Game started (debug mode)');
                return Promise.resolve();
            },

            setLoadingProgress: function(progress) {
                console.log('[Yes2SDK] Loading progress: ' + progress + '%');
            },

            performHapticFeedback: function() {
                console.log('[Yes2SDK] Haptic feedback (debug mode)');
            },

            getPlatform: function() {
                return this._platform;
            },

            get isInitialized() {
                return this._initialized;
            },

            // Ads module - mock implementation for debug/local testing
            ads: {
                showInterstitial: function(placement, callbacks) {
                    callbacks = callbacks || {};
                    console.log('[Yes2SDK] Mock interstitial ad: ' + placement);
                    if (callbacks.beforeAd) callbacks.beforeAd();
                    if (callbacks.afterAd) callbacks.afterAd();
                    return Promise.resolve();
                },

                showRewarded: function(placement, callbacks) {
                    callbacks = callbacks || {};
                    console.log('[Yes2SDK] Mock rewarded ad: ' + placement);
                    if (callbacks.beforeAd) callbacks.beforeAd();
                    if (callbacks.adViewed) callbacks.adViewed();
                    if (callbacks.afterAd) callbacks.afterAd();
                    return Promise.resolve();
                },

                showBanner: function(position) {
                    console.log('[Yes2SDK] Mock banner shown at: ' + position);
                    return Promise.resolve();
                },

                hideBanner: function() {
                    console.log('[Yes2SDK] Mock banner hidden');
                },

                isAdBlocked: function() {
                    return false;
                }
            }
        };
    </script>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        // Show warning banner for mobile/unsupported browsers
        function showWarning(msg) {
            warningBanner.style.display = "block";
            warningBanner.innerHTML = msg;
            setTimeout(function() {
                warningBanner.style.display = "none";
            }, 5000);
        }

        // Unity loader configuration
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}",
            showBanner: showWarning,
        };

        // Configure canvas for responsive sizing
        canvas.style.width = "100%";
        canvas.style.height = "100%";

        // Load Unity
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                progressBarFull.style.width = 100 * progress + "%";
            }).then(function(unityInstance) {
                loadingBar.style.display = "none";

                // Store Unity instance globally for debugging
                window.unityInstance = unityInstance;

            }).catch(function(message) {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
