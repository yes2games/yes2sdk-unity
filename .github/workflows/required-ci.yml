name: YES2 Unity Required CI Workflow

# The canonical required CI for this repository, and its only release authority
# (yes2games/yes2sdk-unity#97, yes2games/yes2dashboard#141).
#
# `push: main` is not a second copy of the pull-request lanes. It is where the
# release happens. The release job lives in this same workflow run, at this same
# commit, behind an ordinary `needs:` edge on the final gate, so there is no run
# to look up, no attempt to compare, and no window in which `main` can move
# between the proof and the mutation (yes2games/yes2dashboard#141 section 5).
# That is why the push trigger is mandatory and cannot be path-filtered.

on:
  pull_request:
  push:
    branches: [main]

# A superseded pull-request run cancels; a push to `main` never does. Grouping
# main runs by ref would let a newer push cancel a pending run, and a pending run
# on main carries a release. Serialization of the mutation itself is on the
# release job, which is the only thing that must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job names one explicit GitHub-hosted runner class. This repository is
# public, so hosted minutes are free here; the organization's no-hosted-runners
# rule covers its private repositories, where minutes are billed. Nothing
# consults a repository variable, because a public repository has no reason to
# reach for the self-hosted fleet at all.
#
# `ubuntu-24.04` rather than `ubuntu-latest`: a floating label would let the
# machine class move under the release job's determinism guard (#97 section 9)
# without a commit that says so.

jobs:
  workflow-governance:
    name: Workflow governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Verify canonical workflow and final-gate identities
        run: node 'ci~/verify-workflow-governance.mjs'

  release-state:
    name: Release state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      unity-credentials: ${{ steps.credentials.outputs.present }}
      unity-credentials-missing: ${{ steps.credentials.outputs.missing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Verify version authority, mirrors and the Release Please contract
        run: node 'ci~/verify-release-state.mjs'

      # The advisory push guard, exercised in both checkout shapes. It lives here
      # rather than in a job of its own because #97 section 4 fixes the mandatory
      # result list at six names, and a guard nobody has seen fail is not a guard.
      - name: Verify the pre-push hook refuses only the default branch
        run: node 'ci~/verify-pre-push-hook.mjs'

      # Whether this run can drive a Unity editor at all. game-ci replays the
      # `.ulf` in UNITY_LICENSE and uses the account credentials alongside it, so
      # all three are read and all three gate coverage.
      #
      # The probe lives here
      # rather than in a job of its own because #97 section 4 fixes the mandatory
      # result list at six names, and a seventh job would change that list.
      #
      # It must be a step: the `secrets` context is not available in a job-level
      # `if:`, so a conditional editor lane can only read this through a job
      # output. The expressions below compare each secret to the empty string and
      # emit only the resulting boolean, so no secret value is ever materialised
      # into the environment, the log or the output.
      - name: Probe for Unity credentials
        id: credentials
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_LICENSE" = "true" ]  || missing="$missing UNITY_LICENSE"
          [ "$HAS_EMAIL" = "true" ]    || missing="$missing UNITY_EMAIL"
          [ "$HAS_PASSWORD" = "true" ] || missing="$missing UNITY_PASSWORD"
          missing="${missing# }"

          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "Unity credentials are present; the editor lanes will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "Unity credentials are absent: $missing"
          fi

  wrapper-parity:
    name: Wrapper parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Check wrapper method parity
        run: node 'scripts~/check-wrapper-parity.mjs'

  optimizer-anchors:
    name: Optimizer anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Check optimizer docs anchors
        run: node 'scripts~/check-optimizer-anchors.mjs'

  # The compatibility matrix (#97 section 3). Both lanes run the package through
  # ci~/consumer, the committed minimal project that installs this checkout over a
  # local file dependency and owns the test framework, so the tests #70 built are
  # consumed by the lanes rather than sitting unused beside them.
  #
  # The editor image is named explicitly rather than composed by the action from a
  # default image-version suffix: only the `-3` variant exists for 6000.3.16f1, and
  # a suffix the action picks is a dependency nothing in this file can see.
  unity-floor:
    name: Unity 2021.3.0f1 floor lane
    # Skipped, never faked, when this run cannot drive an editor. A lane that
    # exits 0 without starting Unity would be a green that means "we skipped the
    # hard part"; a skipped lane renders grey and claims nothing.
    needs: [release-state]
    if: needs.release-state.outputs.unity-credentials == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # One floor lane at a time across the whole repository, so two open pull
    # requests queue rather than stacking Unity seats. Paired with the same rule on
    # the current lane, the ceiling is the two seats a single run needs. The groups
    # sit on the jobs rather than on the workflow because a workflow-level group
    # shared across pull requests cannot also cancel a superseded run of the same
    # pull request, and #97 section 11 requires that cancellation.
    concurrency:
      group: yes2-unity-seat-floor
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # A hosted runner does not have room for a Unity editor image without this.
      # Safe to run unguarded now that every job is hosted: the VM is ephemeral and
      # nothing here is shared with another job.
      - name: Free disk space for the Unity editor image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Package resolve, compile and every package EditMode test
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci~/consumer
          unityVersion: 2021.3.0f1
          customImage: unityci/editor:ubuntu-2021.3.0f1-webgl-3
          testMode: EditMode
          artifactsPath: floor-test-results

      # game-ci bundles licence activation and the test run into one action, so a
      # failure here cannot be told apart from outside: this annotation says which
      # strings to look for rather than claiming to know. Unity refusing to start
      # with a message that points nowhere is the failure this exists to prevent.
      - name: Explain a possible licence failure
        if: failure()
        run: |
          echo "::warning title=PROVISIONING: this may be a licence failure rather than a test failure::\
          Search this job's log for 'Missing Unity License' or 'Licensing'. If the step failed during \
          activation rather than during the tests, it is provisioning and no change to this branch will \
          fix it: check that UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD are set, and that a Personal \
          seat is free - a seat leaked by an earlier cancelled run stays checked out until it is revoked \
          in Unity ID seat management. If instead the log shows test results, this is a real test failure \
          and belongs to the change under review."

  unity-current:
    name: Unity 6000.3.16f1 current lane + WebGL smoke
    # Skipped, never faked, when this run cannot drive an editor. A lane that
    # exits 0 without starting Unity would be a green that means "we skipped the
    # hard part"; a skipped lane renders grey and claims nothing.
    needs: [release-state]
    if: needs.release-state.outputs.unity-credentials == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # One current lane at a time across the repository. See the floor lane's note.
    concurrency:
      group: yes2-unity-seat-current
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # A hosted runner does not have room for a Unity editor image without this.
      # Safe to run unguarded now that every job is hosted: the VM is ephemeral and
      # nothing here is shared with another job.
      - name: Free disk space for the Unity editor image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Package resolve, compile and every package EditMode test
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci~/consumer
          unityVersion: 6000.3.16f1
          customImage: unityci/editor:ubuntu-6000.3.16f1-webgl-3
          testMode: EditMode
          artifactsPath: current-test-results

      # A real WebGL player, not a compile: the supported installer runs, the
      # template it installs is verified, Yes2SDKBuildGuard evaluates it as a
      # preprocess callback, and BuildPipeline.BuildPlayer has to succeed and leave
      # a loader behind. Any of those failing exits the editor non-zero.
      # unity-builder is deliberately held at v4.5.0 and is NOT to be bumped to v6
      # without reading this. v6 routes the build through a game-ci CLI and ends at
      # "Build failed with exit code 1" with no editor log behind it; v4.5.0 streams
      # the editor log. A version that hides the evidence is a downgrade for a lane
      # whose entire job is producing evidence. unity-test-runner stays on v4.3.2,
      # which is genuinely latest and does stream.
      - name: Real WebGL package smoke
        uses: game-ci/unity-builder@3b26780ddfe24a0ee2aebb0a65297ab69fc5bb4c # v4.5.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci~/consumer
          unityVersion: 6000.3.16f1
          customImage: unityci/editor:ubuntu-6000.3.16f1-webgl-3
          targetPlatform: WebGL
          buildMethod: Yes2Games.CI.Yes2SDKCiSmoke.BuildWebGL
          buildName: Yes2SDKSmoke
          versioning: None
          allowDirtyBuild: true

      # game-ci bundles licence activation and the test run into one action, so a
      # failure here cannot be told apart from outside: this annotation says which
      # strings to look for rather than claiming to know. Unity refusing to start
      # with a message that points nowhere is the failure this exists to prevent.
      - name: Explain a possible licence failure
        if: failure()
        run: |
          echo "::warning title=PROVISIONING: this may be a licence failure rather than a test failure::\
          Search this job's log for 'Missing Unity License' or 'Licensing'. If the step failed during \
          activation rather than during the tests, it is provisioning and no change to this branch will \
          fix it: check that UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD are set, and that a Personal \
          seat is free - a seat leaked by an earlier cancelled run stays checked out until it is revoked \
          in Unity ID seat management. If instead the log shows test results, this is a real test failure \
          and belongs to the change under review."

  required-ci:
    name: YES2 Unity Required CI
    needs:
      - workflow-governance
      - release-state
      - wrapper-parity
      - optimizer-anchors
      - unity-floor
      - unity-current
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      # Step one is the release contract. These four never get an exception: no
      # credential state, no event, no fork makes a contract assertion optional.
      - name: Assert every release-contract result is an exact success
        env:
          CONTRACT_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const CONTRACT = ["workflow-governance", "release-state", "wrapper-parity", "optimizer-anchors"];
            const needs = JSON.parse(process.env.CONTRACT_RESULTS);
            const entries = CONTRACT.map((job) => [job, needs[job]?.result]);
            const missing = entries.filter(([, result]) => result === undefined).map(([job]) => job);
            if (missing.length > 0) {
              console.error(`::error title=Contract failure::the final gate does not depend on ${missing.join(", ")}`);
              process.exit(1);
            }
            for (const [job, result] of entries) {
              console.log(`${result === "success" ? "ok  " : "FAIL"} ${job}: ${result}`);
            }
            const bad = entries.filter(([, result]) => result !== "success");
            if (bad.length > 0) {
              console.error(
                `::error title=Contract failure: a release-contract assertion did not pass::` +
                  `${bad.map(([job, result]) => `${job} is ${result}`).join("; ")}. ` +
                  `This is the repository failing its own contract, not a provisioning problem.`
              );
              process.exit(1);
            }
            console.log(`all ${entries.length} release-contract results succeeded`);
          '

      # Step two is editor coverage, kept separate and named for provisioning so a
      # missing credential and a broken contract can never look alike. It runs even
      # when step one failed, so one run reports both verdicts.
      #
      # The credential state is re-read here from the secrets themselves rather
      # than trusted from the probe's output, so "credentials exist but a lane was
      # skipped" - coverage quietly switched off - is a failure rather than a pass.
      - name: Assert Unity editor coverage
        if: always()
        env:
          ALL_RESULTS: ${{ toJSON(needs) }}
          PROBE: ${{ needs.release-state.outputs.unity-credentials }}
          MISSING: ${{ needs.release-state.outputs.unity-credentials-missing }}
          HAS_CREDENTIALS: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          node -e '
            const EDITOR = ["unity-floor", "unity-current"];
            const needs = JSON.parse(process.env.ALL_RESULTS);
            const results = EDITOR.map((job) => [job, needs[job]?.result]);
            const has = process.env.HAS_CREDENTIALS === "true";
            const probe = process.env.PROBE;
            const missing = process.env.MISSING || "UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD";
            const onMain = process.env.EVENT === "push";
            const fork = process.env.IS_FORK === "true";
            const fs = require("node:fs");
            const summary = (text) => {
              if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + "\n");
            };

            for (const [job, result] of results) console.log(`${job}: ${result}`);

            if (has !== (probe === "true")) {
              console.error(
                `::error title=Contract failure: the credential probe disagrees with the secrets::` +
                  `probe reported ${probe} but this job reads ${has}.`
              );
              process.exit(1);
            }

            if (has) {
              const bad = results.filter(([, result]) => result !== "success");
              if (bad.length > 0) {
                const detail = bad.map(([j, r]) => `${j} is ${r}`).join("; ");
                // Only call it "switched off" when nothing actually failed. A lane
                // skipped because the lane before it failed is a cascade, and a
                // cancelled lane is almost always the single-seat queue dropping a
                // pending job; blaming either on someone disabling coverage would
                // send the reader to the wrong place.
                if (bad.some(([, r]) => r === "cancelled")) {
                  console.error(
                    `::error title=Contract failure: an editor lane was cancelled::${detail}. ` +
                      `The likeliest cause is the single-seat queue: this repository holds at most one ` +
                      `Unity seat, and GitHub keeps only one pending job per concurrency group, so a third ` +
                      `concurrent demand drops the one already waiting. Re-run the cancelled lane.`
                  );
                } else if (bad.some(([, r]) => r === "failure")) {
                  console.error(`::error title=Contract failure: an editor lane did not pass::${detail}.`);
                } else {
                  console.error(
                    `::error title=Contract failure: editor coverage was switched off while credentials exist::${detail}.`
                  );
                }
                process.exit(1);
              }
              summary("## Coverage: FULL\n\nBoth Unity editor lanes ran and passed. This gate covers the release contract and the package tests.");
              console.log("editor coverage is complete");
              process.exit(0);
            }

            // No credentials. The lanes must be exactly skipped - a failure here
            // would mean something other than provisioning went wrong.
            const notSkipped = results.filter(([, result]) => result !== "skipped");
            if (notSkipped.length > 0) {
              console.error(
                `::error title=Contract failure: an editor lane did not skip cleanly without credentials::` +
                  `${notSkipped.map(([j, r]) => `${j} is ${r}`).join("; ")}.`
              );
              process.exit(1);
            }

            const secrets = missing.split(/\s+/).filter(Boolean).join(", ");
            const forkNote = fork
              ? " This is a pull request from a fork, and a fork never receives repository secrets on a public repository. " +
                "Nothing is wrong with this contribution and nothing about it needs changing: the editor lanes cannot run here by design."
              : "";

            if (onMain) {
              const message =
                `PROVISIONING, NOT A CONTRACT FAILURE. The Unity editor lanes did not run because ` +
                `${secrets} ${missing.split(/\s+/).filter(Boolean).length === 1 ? "is" : "are"} not set on this repository. ` +
                `Every release-contract assertion passed. Add ${secrets} as repository secrets and re-run; ` +
                `no change to this branch is needed. main is held red deliberately: this gate is one name making one ` +
                `claim, and it will not assert coverage that did not happen.`;
              console.error(`::error title=PROVISIONING: Unity credentials missing on this repository::${message}`);
              summary(
                `## Coverage: PARTIAL - editor lanes did not run\n\n` +
                  `**This is a provisioning failure, not a contract failure.**\n\n` +
                  `Missing repository secrets: \`${secrets}\`\n\n` +
                  `The release contract passed in full. The package tests and the WebGL smoke did not run at all, ` +
                  `and this gate does not claim they did. Add the secrets above and re-run.`
              );
              process.exit(1);
            }

            console.log(
              `::warning title=PROVISIONING: Unity editor lanes did not run::` +
                `${secrets} ${missing.split(/\s+/).filter(Boolean).length === 1 ? "is" : "are"} not set, so the editor lanes were skipped.` +
                `${forkNote} This gate covers the release contract only and does not claim package-test coverage.`
            );
            summary(
              `## Coverage: PARTIAL - editor lanes did not run\n\n` +
                `Missing repository secrets: \`${secrets}\`\n\n` +
                `**What this gate checked:** the release contract - required-CI identity and governance, ` +
                `release-state and version mirrors, the CHANGELOG guard, the pre-push hook, wrapper parity, ` +
                `optimizer anchors.\n\n` +
                `**What it did not check:** package resolve and compile, every package EditMode test, and the ` +
                `real WebGL smoke. Those need a Unity editor.${fork ? "\n\nThis is a fork pull request. A fork never receives repository secrets on a public repository, so this outcome is expected and is not a defect in the contribution." : ""}\n\n` +
                `A push to \`main\` in this state fails the gate deliberately.`
            );
            console.log("release contract proven; editor coverage not run");
          '

  # The release. It runs only on a push to `main` whose final gate went green in
  # THIS run, and that `needs:` edge is the whole of the proof-of-CI-at-the-
  # release-commit requirement: same run, same commit, nothing to look up
  # (yes2games/yes2dashboard#141 section 5).
  #
  # `R`, the stable candidate, is `github.sha`. Merge, squash and rebase all
  # produce exactly one commit on `main` and that commit is what `github.sha`
  # names, so there is nothing to enumerate and nothing to match (#97 section 9).
  release:
    name: Release
    needs:
      - required-ci
      - release-state
    # The gate already fails on `main` when the editor lanes could not run, so
    # this condition is defence in depth rather than the primary guard. It is here
    # because the mutation path should state its own precondition: nothing tags,
    # moves edge or publishes off a run that could not drive a Unity editor, and
    # therefore could not run the consumer smokes that prove what it released.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.required-ci.result == 'success'
      && needs.release-state.outputs.unity-credentials == 'true'
    # One explicit runner class (#97 section 9, guard 1): a determinism check means
    # nothing if the machine class underneath it is free to change, so the class
    # is named outright and cannot move without a commit that says so.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Required, not optional (yes2games/yes2dashboard#141 section 13, item 3). The
    # needs: edge orders CI before the tag inside one run; nothing orders two runs.
    # Non-cancelling, because a cancelled release is a lost release. GitHub still
    # keeps at most one pending entry per group, so three merges inside one release
    # window can drop the middle one; two - the case the contract names - is safe.
    concurrency:
      group: yes2-unity-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE: ${{ github.sha }}
      # The known historical stable baseline (#97 section 7). Bootstrap reconciles
      # to this rather than guessing; v2.8.0 is the newest canonical stable Release
      # in this repository at the time this lane landed.
      STABLE_BASELINE: "2.8.0"
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      # A hosted runner does not have room for a Unity editor image without this.
      # Safe to run unguarded now that every job is hosted: the VM is ephemeral and
      # nothing here is shared with another job.
      - name: Free disk space for the Unity editor image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # gh is the only tool this job needs that is not coreutils, git or node, so
      # its presence is asserted rather than assumed - and asserted before the
      # first command that mutates anything, so a missing gh surfaces ahead of the
      # draft rather than between the draft and the publish.
      #
      # It is not installed here. Jobs run inside the runner container image, which
      # ships gh and jq; the host's tool set is a different machine's and says
      # nothing about the job's. This check costs nothing and is now the only way
      # this can break: the image changing out from under the workflow.
      - name: Require a usable gh on this runner
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh is not available in this job, and the release path cannot move edge," >&2
            echo "draft, publish or dispatch without it. The runner container image is" >&2
            echo "expected to ship it; check the image rather than adding an install step." >&2
            exit 1
          fi
          gh --version
          gh auth status

      # Vsource == Vstable permits Release Please maintenance and nothing else.
      # Vsource > Vstable means a stable finalization is pending for Vsource - the
      # release PR has merged and this push is it. Vsource < Vstable is an
      # invariant failure and fails closed (#97 section 7).
      - name: Resolve release state
        id: state
        run: |
          set -euo pipefail
          VSOURCE=$(node -p "require('./package.json').version")

          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          VSTABLE=${LATEST:-$STABLE_BASELINE}

          newest() { printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1; }

          if [ "$(newest "$VSTABLE" "$STABLE_BASELINE")" != "$VSTABLE" ]; then
            echo "newest canonical stable $VSTABLE is older than the recorded baseline $STABLE_BASELINE; refusing to guess a baseline" >&2
            exit 1
          fi

          if [ "$VSOURCE" = "$VSTABLE" ]; then
            MODE=rp
          elif [ "$(newest "$VSOURCE" "$VSTABLE")" = "$VSOURCE" ]; then
            MODE=stable
          else
            echo "invariant failure: source version $VSOURCE is behind the newest canonical stable $VSTABLE" >&2
            exit 1
          fi

          {
            echo "vsource=$VSOURCE"
            echo "vstable=$VSTABLE"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

          echo "Vsource=$VSOURCE Vstable=$VSTABLE mode=$MODE candidate=$CANDIDATE"

      # edge is a mutable Git tag and nothing else: no GitHub Release, no
      # prerelease (#97 section 8). Absent, equal or an ancestor is allowed;
      # divergence or regression fails closed.
      - name: Move the edge tag to the candidate
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          git fetch --force origin 'refs/tags/edge:refs/tags/edge' 2>/dev/null || true

          if git rev-parse -q --verify 'refs/tags/edge^{commit}' >/dev/null; then
            EDGE=$(git rev-parse 'refs/tags/edge^{commit}')
            if [ "$EDGE" = "$CANDIDATE" ]; then
              echo "edge already equals the candidate $CANDIDATE"
            elif git merge-base --is-ancestor "$EDGE" "$CANDIDATE"; then
              echo "edge $EDGE is an ancestor of the candidate $CANDIDATE"
            else
              echo "edge $EDGE is neither absent, equal, nor an ancestor of $CANDIDATE: divergence or regression, failing closed" >&2
              exit 1
            fi
          else
            echo "no edge tag yet; this push establishes it"
          fi

          git push --force origin "$CANDIDATE:refs/tags/edge"
          echo "diagnostics: ref=edge sha=$CANDIDATE semver=$V channel=edge unity=6000.3.16f1"

      - name: Build a clean edge consumer
        run: node 'ci~/make-consumer.mjs' .edge-consumer 'https://github.com/yes2games/yes2sdk-unity.git#edge'

      - name: Edge consumer package smoke
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        with:
          projectPath: .edge-consumer
          unityVersion: 6000.3.16f1
          customImage: unityci/editor:ubuntu-6000.3.16f1-webgl-3
          testMode: EditMode
          artifactsPath: edge-test-results

      - name: Edge consumer resolved the exact candidate
        run: node 'ci~/verify-resolved-ref.mjs' .edge-consumer "$CANDIDATE"

      - name: Edge consumer WebGL integration smoke
        uses: game-ci/unity-builder@3b26780ddfe24a0ee2aebb0a65297ab69fc5bb4c # v4.5.0
        with:
          projectPath: .edge-consumer
          unityVersion: 6000.3.16f1
          customImage: unityci/editor:ubuntu-6000.3.16f1-webgl-3
          targetPlatform: WebGL
          buildMethod: Yes2Games.CI.Yes2SDKCiSmoke.BuildWebGL
          buildName: Yes2SDKEdgeSmoke
          versioning: None
          allowDirtyBuild: true

      # Everything below finalizes the stable release, and runs only when the
      # merged Release Please PR advanced the source version past the newest
      # canonical stable.
      #
      # This is also the CHANGELOG-section guard (#97 section 9, guard 2): a
      # version bumped outside the Release Please PR has no section, and
      # verify-release-state.mjs fails the job loudly instead of the release
      # failing closed and silently the way yes2sdk-core v2.7.1 did.
      - name: Verify the version mirrors and the CHANGELOG section at the release commit
        if: steps.state.outputs.mode == 'stable'
        run: node 'ci~/verify-release-state.mjs'

      - name: Require the stable tag to be absent
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "refs/tags/v$V already exists; a published stable is never rewritten, a content fix needs a new SemVer" >&2
            exit 1
          fi
          echo "refs/tags/v$V is absent"

      - name: Derive the release notes from the exact CHANGELOG section
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "the CHANGELOG section for $V is empty; refusing to publish a stable release with no notes" >&2
            exit 1
          fi
          echo "release notes: $(wc -l < release-notes.md) line(s)"

      - name: Create the stable draft targeting the release commit
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          gh release create "v$V" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$CANDIDATE" \
            --title "v$V" \
            --notes-file release-notes.md

      - name: Assert the tag stays absent while the release is unpublished
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "the platform exposed refs/tags/v$V before the draft was published." >&2
            echo "#97 section 10 says fail closed and re-specify rather than continue." >&2
            exit 1
          fi
          echo "refs/tags/v$V is still absent while the release is a draft"

      - name: Validate the draft
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish > draft.json
          cat draft.json
          node -e '
            const draft = JSON.parse(require("node:fs").readFileSync("draft.json", "utf8"));
            const want = { tagName: `v${process.env.V}`, isDraft: true, isPrerelease: false, targetCommitish: process.env.CANDIDATE };
            const bad = Object.entries(want).filter(([key, value]) => draft[key] !== value);
            if (bad.length > 0) {
              for (const [key, value] of bad) {
                console.error(`draft ${key} is ${JSON.stringify(draft[key])}, expected ${JSON.stringify(value)}`);
              }
              process.exit(1);
            }
            console.log("draft is valid and targets the release commit");
          '

      # Publish LAST (#97 section 10). Publication is what creates the tag and
      # makes the release visible, and a stable release is never rewritten by
      # contract - bad content requires a new SemVer - so every assertion above has
      # to hold before this line, not after it. Repository-level release
      # immutability is dropped organization-wide by operator decision; the
      # never-rewritten rule and the exact-github.sha target are what carry it.
      - name: Publish the draft
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify the published stable release
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git ls-remote origin "refs/tags/v$V^{}" | awk '{print $1}')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/v$V" | awk '{print $1}')
          fi
          if [ "$TAG_SHA" != "$CANDIDATE" ]; then
            echo "refs/tags/v$V points at ${TAG_SHA:-nothing}, expected the release commit $CANDIDATE" >&2
            exit 1
          fi

          gh release view "v$V" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish > published.json
          cat published.json
          node -e '
            const release = JSON.parse(require("node:fs").readFileSync("published.json", "utf8"));
            const want = { tagName: `v${process.env.V}`, isDraft: false, isPrerelease: false, targetCommitish: process.env.CANDIDATE };
            const bad = Object.entries(want).filter(([key, value]) => release[key] !== value);
            if (bad.length > 0) {
              for (const [key, value] of bad) {
                console.error(`published release ${key} is ${JSON.stringify(release[key])}, expected ${JSON.stringify(value)}`);
              }
              process.exit(1);
            }
          '

          # No `gh release verify` here. It reads the attestation GitHub mints only
          # for an immutable release, and repository-level release immutability is
          # not enabled anywhere in this organization by operator decision. Calling
          # it would fail after the publish, the one step with no way back. What the
          # tag points at is asserted above from git itself, which needs no
          # attestation.
          echo "diagnostics: ref=v$V sha=$CANDIDATE semver=$V channel=stable unity=6000.3.16f1"

      - name: Build a clean exact-tag consumer
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: node 'ci~/make-consumer.mjs' .stable-consumer "https://github.com/yes2games/yes2sdk-unity.git#v$V"

      - name: Stable consumer package smoke
        if: steps.state.outputs.mode == 'stable'
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        with:
          projectPath: .stable-consumer
          unityVersion: 6000.3.16f1
          customImage: unityci/editor:ubuntu-6000.3.16f1-webgl-3
          testMode: EditMode
          artifactsPath: stable-test-results

      - name: Stable consumer resolved the exact release commit
        if: steps.state.outputs.mode == 'stable'
        run: node 'ci~/verify-resolved-ref.mjs' .stable-consumer "$CANDIDATE"

      - name: Stable consumer WebGL integration smoke
        if: steps.state.outputs.mode == 'stable'
        uses: game-ci/unity-builder@3b26780ddfe24a0ee2aebb0a65297ab69fc5bb4c # v4.5.0
        with:
          projectPath: .stable-consumer
          unityVersion: 6000.3.16f1
          customImage: unityci/editor:ubuntu-6000.3.16f1-webgl-3
          targetPlatform: WebGL
          buildMethod: Yes2Games.CI.Yes2SDKCiSmoke.BuildWebGL
          buildName: Yes2SDKStableSmoke
          versioning: None
          allowDirtyBuild: true

      # A Release published with GITHUB_TOKEN fires no `release: published` event,
      # so consumers are woken explicitly. repository_dispatch is the documented
      # exception to the GITHUB_TOKEN recursion rule and does start a run
      # (#97 section 10, yes2games/yes2dashboard#141 section 4).
      - name: Wake stable consumers explicitly
        if: steps.state.outputs.mode == 'stable'
        env:
          V: ${{ steps.state.outputs.vsource }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f "event_type=stable-released" \
            -f "client_payload[tag]=v$V"

      # Release Please maintenance runs only when there is nothing to finalize.
      # The App token exists for one reason and no other: a pull request opened
      # with GITHUB_TOKEN fires no `pull_request` event, so the release PR would
      # face no gate at all (yes2games/yes2dashboard#141 section 4). Everything
      # after the merge uses the workflow's own GITHUB_TOKEN.
      - name: Mint the Butler App token
        id: app-token
        if: steps.state.outputs.mode == 'rp'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUTLER_APP_ID }}
          private-key: ${{ secrets.BUTLER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Release Please maintenance
        if: steps.state.outputs.mode == 'rp'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
