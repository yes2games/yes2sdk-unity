name: Notify Google Chat on Release

# Published stable releases only, and read-only (#97 section 11).
#
# The repository_dispatch trigger is not a convenience. A Release published with
# the workflow's own GITHUB_TOKEN fires no `release: published` event, so the
# release job wakes this workflow explicitly; repository_dispatch is the
# documented exception to the GITHUB_TOKEN recursion rule. The `release` trigger
# stays for a release published by a person through the UI. Neither path is
# allowed to be the only one (yes2games/yes2dashboard#141 section 4).
#
# The work is one Node script rather than gh piped through jq: this
# organization's runners are self-hosted and supply neither, and a read-only
# notifier is not a good reason to install a toolchain onto a shared host.

on:
  release:
    types: [published]
  repository_dispatch:
    types: [stable-released]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Google Chat
    runs-on: ${{ fromJson(vars.RUNNER_HOST && format('["self-hosted","{0}","light"]', vars.RUNNER_HOST) || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Announce the published stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: node 'ci~/notify-release.mjs' "${EVENT_TAG:-${DISPATCH_TAG:-}}"
